# ---- 4.4 按月追加原版视频 ----
# 是否将原版视频按月追加到月稿件（true/false）
# 开启后，所有原版视频（mp4/flv）按自然月分组，自动新建当月稿件或追加到已有月稿件；未压制的视频不参与新投稿（新投稿仅含弹幕版）
# 关闭时，未压制的视频既不追加也不投稿，仅保留本地备份
ENABLE_APPEND_RAW_VIDEO=false
# 月份->VID 映射文件（自动维护，格式：主播|YYYY-MM=BV号，每行一条）
APPEND_MONTHLY_MAP_FILE="/rec/data/append_month_vid.map"
# 新建月稿件的标题模板，可用 {streamer} {month}(2026-10) {month_cn}(2026年10月)
APPEND_MONTHLY_TITLE_TEMPLATE="{month_cn}直播回放合集"
# 新建月稿件的简介模板
APPEND_MONTHLY_DESC_TEMPLATE="本稿件为{streamer}{month_cn}原版直播回放合集
弹幕网盘：{pan_url}"
# 月稿件简介中网盘地址的前缀（{pan_url} = 前缀/{streamer}/{yyyy}/{mm}，中文自动URL编码）
RCLONE_XML_PAN_URL="https://openlist.xct258.top/直播回放弹幕"
# xml上传用的rclone远端名（远端需在rclone.conf中配置）
RCLONE_XML_REMOTE="openlist-webdav"
# webdav存放路径模板，可用 {streamer} {yyyy} {mm} {dd} {month}(YYYY-MM) {date}(YYYY-MM-DD)
RCLONE_XML_PATH_TEMPLATE="/ssd-1/xct258/直播回放弹幕/{streamer}/{yyyy}/{mm}/{date}"
# 新建月稿件的封面图片（不存在则不带封面投稿）
APPEND_MONTHLY_COVER="/rec/assets/合集封面.jpg"

# ---- 4.5 网盘备份与弹幕上传 ----
# 是否启用 rclone 网盘备份（true/false）
ENABLE_RCLONE_UPLOAD=false

# ---- 4.6 清理与音频/语音识别 ----
# 是否启用自动清理旧视频（true/false），超过保留天数的视频将被删除
ENABLE_CLEANUP=true
# 视频保留天数
RETENTION_DAYS=5
# 是否从原始视频中提取音频（true/false）
ENABLE_AUDIO_EXTRACT=false
# 是否提交音频到语音识别后端（true/false）
# 注意：开启此选项后，无论 ENABLE_AUDIO_EXTRACT 是否开启，都会从原始视频中提取音频
ENABLE_ASR_SUBMIT=false
# 语音识别远程路径映射，将本地路径前缀替换为远程 Windows 网络路径或者linux路径，便于语音识别后端访问视频文件
# linux不需要映射，直接使用原始路径即可
# Windows网络路径示例（注意！必须使用单引号）：/rec/videos -> '\\TRUENAS\ssd-1\khx-live\videos'
ASR_PATH_TYPE="linux" # 可选值：windows、linux
# 语音识别后端服务器地址
ASR_SERVER="127.0.0.1"
# 语音识别后端服务器端口
ASR_PORT="8286"
# linux下此参数无效，Windows下此参数为远程路径映射的前缀
ASR_REMOTE_PATH='\\\\TRUENAS\\ssd-1\\khx-live\\videos'
