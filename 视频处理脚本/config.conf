# =====================================================================
# 1. 基础开关（容器级，改动后需重启容器）
# =====================================================================
# 是否执行上传备份脚本（true/false）
ENABLE_UPLOAD_SCRIPT=true
# 是否启用在线切片功能（true/false），修改后需要重启容器以生效，会自动开始安装相关依赖
ENABLE_WEBCLIP=false
# 是否启用语音识别功能（true/false），修改后需要重启容器以生效，会自动开始安装相关依赖和下载模型文件
ENABLE_OPENCC=false
# 是否安装intel核显驱动（true/false），若容器运行在intel核显的主机上，建议开启此选项以提高视频压制性能
# 修改后需要重启容器以生效，会自动开始安装相关依赖
ENABLE_INTEL_GPU=false

# =====================================================================
# 2. 在线切片（仅 ENABLE_WEBCLIP=true 时生效）
# =====================================================================
# 在线切片服务监听的端口
WEBCLIP_PORT=8186

# =====================================================================
# 3. 语音识别（仅 ENABLE_OPENCC=true 时生效）
# =====================================================================
# 语音识别模型选择，可选模型：tiny、tiny.en、base、base.en、small、small.en、medium、medium.en、large-v2、large-v3、large-v3-turbo（默认）
# 模型越大识别效果越好，但需要更多显存/内存和下载时间
OPENCC_MODEL="large-v3-turbo"

# =====================================================================
# 4. 上传备份脚本（仅 ENABLE_UPLOAD_SCRIPT=true 时生效）
# =====================================================================
# ---- 4.1 通用 ----
# 服务器名称
server_name="pve-1-debian-1"
# 需要监控的录制平台（录播姬 / biliup，可多个）
update_servers=(
  #"biliup"
  "录播姬"
)
# 设置视频源文件夹路径，只处理设置目录中文件夹里的视频，不处理设置目录中的视频
source_folders=(
  #"/rec/biliup/video"
  "/rec/录播姬/video"
  # 可以继续添加其它目录
)
# 上传用的 cookies 文件路径
biliup_up_cookies="/rec/cookies/bilibili/cookies-烦心事远离.json"
# 录播姬同步用的 cookie JSON 文件路径
record_cookie_json="/rec/cookies/bilibili/cookies-xct258-2.json"

# ---- 4.2 弹幕压制 ----
# 是否启用视频压制（true/false）
ENABLE_DANMAKU_OVERLAY=false
# 弹幕压制输出模式（启用弹幕压制生效）
# both/all:       投稿版(无进度条) + 预览版(无进度条)
# both-bar:       投稿版(无进度条) + 预览版(带进度条)
# clean:          只生成投稿版(无进度条)，不生成预览版
# preview:        只生成预览版(带进度条)
# preview-clean:  只生成预览版(无进度条)
DANMAKU_MODE="clean"
# 是否将 FLV 转换为 mp4（true/false），关闭则后续仍使用原 flv 文件
# 注意：不转换为 mp4 不能进行弹幕压制；开启视频压制时此选项无效，必定转换
CONVERT_FLV_TO_MP4=false
# 视频与弹幕之间允许的最大时间差（秒），超过则跳过弹幕压制
MAX_DIFF_LIMIT=25
# DanmakuFactory 转换 xml 为 ass 时的透明度（1-255，255 为不透明）
DanmakuFactory_opacity=155

# ---- 4.3 B站投稿 ----
# 是否启用投稿视频（true/false）
ENABLE_VIDEO_UPLOAD=false
# 上传简介模板，占位符 {title} {platform} {danmaku_count} {cover_time} {cover_p}
# 分别表示直播标题、录制平台、弹幕总数、封面时间节点和所在分P；其余为固定文本，支持多行
UPLOAD_DESC_TEMPLATE='↑↑↑直播间地址↑↑↑
录制平台：{platform}
弹幕总数：{danmaku_count}
封面时间：{cover_p}P {cover_time}

