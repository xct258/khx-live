[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "khx-live"
version = "0.1.0"
description = "通用直播录播处理：录制监控、弹幕压制、B站投稿、归档清理"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "xct258" }]
# 运行时零第三方依赖：tomllib（3.11+）、argparse、logging、sqlite 均来自标准库。
dependencies = []

[project.scripts]
khx = "khx.__main__:main"

[tool.setuptools]
packages = ["khx"]

[tool.pytest.ini_options]
testpaths = ["tests"]
